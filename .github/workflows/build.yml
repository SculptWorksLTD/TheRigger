name: build

# Costruisce The Rigger dal sorgente privato (segreto SOURCE_TOKEN) e pubblica solo
# il programma pronto. Un unico file nativo: finestra WebView del sistema + motore Go,
# senza Electron. Resta solo l'ultima release: l'app installata scarica sempre quella.

on:
  workflow_dispatch:
    inputs:
      solo_foto:
        description: 'Solo le foto di controllo, senza nuova release'
        type: boolean
        default: false
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

env:
  SOURCE_REPO: SculptWorksLTD/TheRiggerSource

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      web: ${{ steps.c.outputs.web }}
      tag: ${{ steps.c.outputs.tag }}
      sha: ${{ steps.c.outputs.sha }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - id: c
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::notice::Manca il segreto SOURCE_TOKEN: nessuna build."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(git ls-remote "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}" refs/heads/main 2>/dev/null | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::SOURCE_TOKEN non riesce a leggere il sorgente (scaduto o senza permessi)."
            exit 1
          fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name + "|" + .body' 2>/dev/null || true)
          tag="${last%%|*}"
          n=0
          case "$tag" in v0.3.*) n="${tag#v0.3.}";; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=0.3.$((n+1))" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # full = build completa; web = cambia solo la finestra (aggiornamento leggero, secondi); none = niente
          mode=full
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            pb=$(printf '%s' "$last" | grep -o 'build [0-9a-f]\{12\}' | head -1 | cut -d' ' -f2)
            pw=$(printf '%s' "$last" | grep -o 'web [0-9a-f]\{12\}' | head -1 | cut -d' ' -f2)
            if [ "${sha:0:12}" = "$pb" ] || [ "${sha:0:12}" = "$pw" ]; then
              mode=none
            elif [ -n "$pb" ]; then
              files=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/${SOURCE_REPO}/compare/${pb}...${sha}" --jq '.files[].filename' 2>/dev/null || echo "?")
              rel=$(printf '%s\n' "$files" | grep -Ev '_test\.go$' | grep -E '^(\?|[^/]+\.go|go\.(mod|sum)|drivers\.json|app/.*|docs/.*|build/.*)$' || true)
              if [ -z "$rel" ]; then
                mode=none
              elif [ "$rel" = "app/therigger.html" ]; then
                mode=web
              fi
            fi
          fi
          echo "Modo: $mode"
          if [ "$mode" = full ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$mode" = web ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  web:
    # aggiornamento leggero: nuova finestra nella release attuale, il programma la scarica da solo
    needs: check
    if: ${{ needs.check.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: Pubblica la finestra
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          npx --yes html-minifier-terser@7 --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true -o window.html app/therigger.html
          gh release upload "$TAG" window.html --clobber --repo "${{ github.repository }}"
          body=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq .body | sed 's/ web [0-9a-f]\{12\}//')
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$body web ${SHA:0:12}"

  mac:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' && !inputs.solo_foto }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: false }
      - name: Prepara (dipendenze e finestra compattata)
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          npx --yes html-minifier-terser@7 --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true -o app/therigger.html app/therigger.html
          mkdir -p dist && cp app/therigger.html dist/window.html
      - name: Compila (Apple e Intel)
        run: |
          flags="-s -w -X main.Version=${VERSION}"
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags "$flags" -o bin/arm64/therigger .
          CGO_ENABLED=1 GOARCH=amd64 CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -trimpath -ldflags "$flags" -o bin/x64/therigger .
          file bin/arm64/therigger bin/x64/therigger
      - name: Icona
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s build/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d build/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
      - name: Crea i .app, firma, zip e installer
        run: |
          set -e
          mkapp() { # cartella-bin, destinazione
            APP="$2/The Rigger.app"; C="$APP/Contents"
            mkdir -p "$C/MacOS" "$C/Resources"
            cp "$1/therigger" "$C/MacOS/therigger"; chmod +x "$C/MacOS/therigger"
            # nome diverso a ogni versione: il Mac rilegge l'icona anche in Applicazioni
            cp icon.icns "$C/Resources/icon-${VERSION}.icns"
            cat > "$C/Info.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>The Rigger</string>
            <key>CFBundleDisplayName</key><string>The Rigger</string>
            <key>CFBundleExecutable</key><string>therigger</string>
            <key>CFBundleIdentifier</key><string>com.sculptworks.therigger</string>
            <key>CFBundleIconFile</key><string>icon-${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PL
            codesign --force --deep --sign - "$APP"
          }
          pack() { # cartella-bin, suffisso, arch-installer, destinazione
            mkapp "$1" "$4"
            ditto -c -k --sequesterRsrc --keepParent "$4/The Rigger.app" "dist/The-Rigger-${VERSION}-$2.zip"
            rm -rf pkgtmp && mkdir -p pkgtmp/scripts && cp build/pkg/postinstall pkgtmp/scripts/ && chmod +x pkgtmp/scripts/postinstall
            pkgbuild --analyze --root "$4" pkgtmp/comp.plist
            /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" -c "Set :0:BundleOverwriteAction upgrade" pkgtmp/comp.plist
            pkgbuild --root "$4" --component-plist pkgtmp/comp.plist --install-location /Applications \
              --scripts pkgtmp/scripts --identifier com.sculptworks.therigger --version "$VERSION" pkgtmp/TheRigger-core.pkg
            sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/$3/" build/pkg/distribution.xml > pkgtmp/distribution.xml
            productbuild --distribution pkgtmp/distribution.xml --resources build/pkg/resources --package-path pkgtmp "dist/The-Rigger-${VERSION}-$2.pkg"
          }
          mkdir -p dist
          pack bin/arm64 Mac arm64 appA
          pack bin/x64 Mac-Intel x86_64 appI
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  windows:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' && !inputs.solo_foto }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: false }
      - name: Prepara (dipendenze, icona e finestra compattata)
        shell: bash
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          npx --yes html-minifier-terser@7 --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true -o app/therigger.html app/therigger.html
          go run github.com/tc-hib/go-winres@latest simply --icon build/icon.ico --product-name "The Rigger" --file-description "The Rigger"
      - name: Compila
        shell: bash
        run: |
          flags="-s -w -H=windowsgui -X main.Version=${VERSION}"
          CGO_ENABLED=1 go build -trimpath -ldflags "$flags" -o "The Rigger.exe" .
          mkdir -p dist zipdir
          cp "The Rigger.exe" zipdir/
          cd zipdir && 7z a "../dist/The-Rigger-${VERSION}-Windows.zip" "The Rigger.exe" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  preview:
    # controllo visivo: avvia il programma con due radio simulate e ne fotografa la finestra
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: false }
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev xvfb imagemagick xclip
      - name: Compila la finestra
        run: |
          go get github.com/webview/webview_go@latest
          go mod tidy
          CGO_ENABLED=1 go build -o therigger .
      - name: Avvio e foto
        run: |
          cat > /tmp/clients.py <<'PY'
          import os, socket, time
          p = "/tmp/TheRigger/IC-7100-1"
          for _ in range(60):
              if os.path.exists(p): break
              time.sleep(0.5)
          fd = os.open(p, os.O_RDWR | os.O_NOCTTY)
          s = socket.create_connection(("127.0.0.1", 4532))
          while True:
              os.write(fd, b"FA;"); s.sendall(b"f\n"); s.recv(100); time.sleep(0.3)
          PY
          stop() { pkill -9 -f clients.py || true; pkill -9 -f therigger || true; sleep 2; rm -rf /tmp/TheRigger; }
          shot() { # nome, lingua, argomenti
            stop
            mkdir -p ~/.config/TheRigger && echo "{\"lang\":\"$2\",\"vports\":4,\"rigctld\":4532,\"drivers\":false}" > ~/.config/TheRigger/config.json
            xvfb-run -a -s "-screen 0 1100x900x24" bash -c "
              ./therigger --demo $3 >app-$1.log 2>&1 &
              python3 /tmp/clients.py >clients-$1.log 2>&1 & sleep 14
              import -window root -trim $1.png" || true
            echo "--- $1"; ls -la /tmp/TheRigger 2>&1 | head -5; tail -n 8 app-$1.log clients-$1.log ~/.config/TheRigger/engine.log 2>/dev/null
            stop
            [ -f $1.png ] && echo "SHOT-$1:$(base64 -w0 $1.png)"
          }
          shot benvenuto it ""
          shot radio-it it --updated
          shot radio-en en --updated

  release:
    needs: [check, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: app-*
          merge-multiple: true
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ls -la dist
          gh release create "v${VERSION}" dist/* \
            --repo "${{ github.repository }}" \
            --title "The Rigger ${VERSION}" \
            --notes "Le installazioni esistenti si aggiornano da sole. (build ${SHA:0:12})" --latest
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            if [ "$t" != "v${VERSION}" ]; then
              gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            fi
          done
