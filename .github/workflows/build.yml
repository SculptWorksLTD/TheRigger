name: build

# Costruisce The Rigger dal sorgente privato (segreto SOURCE_TOKEN) e pubblica solo l'app
# pronta, come CWIU1MVI: finestra Electron + motore Go compilato.
# Resta solo l'ultima release: il programma installato scarica sempre quella.

on:
  workflow_dispatch:
    inputs:
      solo_foto:
        description: 'Solo le foto di controllo, senza nuova release'
        type: boolean
        default: false
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

env:
  SOURCE_REPO: SculptWorksLTD/TheRiggerSource

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - id: c
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::notice::Manca il segreto SOURCE_TOKEN: nessuna build."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(git ls-remote "https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO}" refs/heads/main 2>/dev/null | cut -f1)
          if [ -z "$sha" ]; then
            echo "::error::SOURCE_TOKEN non riesce a leggere il sorgente (scaduto o senza permessi)."
            exit 1
          fi
          last=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name + "|" + .body' 2>/dev/null || true)
          tag="${last%%|*}"
          n=0
          case "$tag" in v0.3.*) n="${tag#v0.3.}";; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=0.3.$((n+1))" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && printf '%s' "$last" | grep -q "build ${sha:0:12}"; then
            echo "Nessuna novità: ultima versione già pubblicata."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  engine:
    # il motore è Go puro: si compila per tutti i sistemi in meno di un minuto
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Compila il motore
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          flags="-s -w -X main.Version=${VERSION}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$flags" -o out/engine/win-x64/therigger-engine.exe .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "$flags" -o out/engine/mac-arm64/therigger-engine .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "$flags" -o out/engine/mac-x64/therigger-engine .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$flags" -o out/engine/linux-x64/therigger-engine .
          ls -laR out/engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: out/engine
          retention-days: 2

  windows:
    needs: [check, engine]
    if: ${{ success() && !inputs.solo_foto }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-win-${{ hashFiles('package.json') }}
          restore-keys: electron-win-
      - name: Installa i pacchetti
        shell: bash
        run: |
          npm pkg set version="$VERSION"
          for t in 1 2 3 4 5; do
            if npm install --no-audit --no-fund > install.log 2>&1; then exit 0; fi
            echo "Tentativo $t fallito"; tail -n 20 install.log; sleep 20
          done
          exit 1
      - name: Build Windows
        shell: bash
        run: |
          for t in 1 2 3; do npm run dist:win && exit 0; echo "Tentativo $t fallito"; sleep 15; done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            dist/*-Windows.zip
            dist/*-Setup.exe
          if-no-files-found: error
          retention-days: 2

  mac:
    needs: [check, engine]
    if: ${{ success() && !inputs.solo_foto }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: engine
      - run: chmod +x engine/mac-*/therigger-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-mac-${{ hashFiles('package.json') }}
          restore-keys: electron-mac-
      - name: Installa i pacchetti
        run: |
          npm pkg set version="$VERSION"
          for t in 1 2 3 4 5; do
            if npm install --no-audit --no-fund > install.log 2>&1; then exit 0; fi
            echo "Tentativo $t fallito"; tail -n 20 install.log; sleep 20
          done
          exit 1
      - name: Build Mac (Apple e Intel)
        run: |
          for t in 1 2 3; do npm run dist:mac && exit 0; echo "Tentativo $t fallito"; sleep 15; done
          exit 1
      - name: Firma ad-hoc, zip e installer
        run: |
          set -e
          ls -d dist/mac*/*.app
          pack() { # cartella, suffisso, architettura per l'installer
            APP="$(ls -d "$1"/*.app | head -n 1)"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep "$APP"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/The-Rigger-${VERSION}-$2.zip"
            rm -rf pkgtmp && mkdir -p pkgtmp/scripts && cp build/pkg/postinstall pkgtmp/scripts/ && chmod +x pkgtmp/scripts/postinstall
            pkgbuild --analyze --root "$1" pkgtmp/comp.plist
            /usr/libexec/PlistBuddy -c "Set :0:BundleIsRelocatable false" -c "Set :0:BundleOverwriteAction upgrade" pkgtmp/comp.plist
            pkgbuild --root "$1" --component-plist pkgtmp/comp.plist --install-location /Applications \
              --scripts pkgtmp/scripts --identifier com.sculptworks.therigger --version "$VERSION" pkgtmp/TheRigger-core.pkg
            sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/$3/" build/pkg/distribution.xml > pkgtmp/distribution.xml
            productbuild --distribution pkgtmp/distribution.xml --resources build/pkg/resources --package-path pkgtmp "dist/The-Rigger-${VERSION}-$2.pkg"
          }
          pack dist/mac-arm64 Mac arm64
          pack dist/mac Mac-Intel x86_64
          ls -la dist/*.zip dist/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: |
            dist/*-Mac.zip
            dist/*-Mac.pkg
            dist/*-Mac-Intel.zip
            dist/*-Mac-Intel.pkg
          if-no-files-found: error
          retention-days: 2

  preview:
    # controllo visivo: avvia l'app con due radio simulate e ne fotografa la finestra (non blocca la release)
    needs: [check, engine]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avvio e foto
        run: |
          chmod +x engine/linux-x64/therigger-engine
          npm install --no-audit --no-fund electron@33 >/dev/null 2>&1
          which xvfb-run import >/dev/null || sudo apt-get install -y -q --no-install-recommends xvfb imagemagick >/dev/null
          cat > /tmp/clients.py <<'PY'
          import os, socket, time
          p = "/tmp/TheRigger/IC-7100-1"
          for _ in range(60):
              if os.path.exists(p): break
              time.sleep(0.5)
          fd = os.open(p, os.O_RDWR | os.O_NOCTTY)
          s = socket.create_connection(("127.0.0.1", 4532))
          while True:
              os.write(fd, b"FA;"); s.sendall(b"f\n"); s.recv(100); time.sleep(0.3)
          PY
          stop() { pkill -9 -f clients.py; pkill -9 -f electron; pkill -9 -f therigger-engine; sleep 2; rm -rf /tmp/TheRigger; true; }
          shot() { # nome, lingua, argomenti
            stop
            mkdir -p ~/.config/TheRigger && echo "{\"lang\":\"$2\",\"vports\":4,\"rigctld\":4532,\"drivers\":false}" > ~/.config/TheRigger/config.json
            xvfb-run -a -s "-screen 0 1100x900x24" bash -c "
              npx electron . --no-sandbox --disable-gpu --demo $3 >app-$1.log 2>&1 &
              python3 /tmp/clients.py >clients-$1.log 2>&1 & sleep 15
              import -window root -trim $1.png" || true
            echo "--- $1"; ls -la /tmp/TheRigger 2>&1 | head -5; tail -n 8 app-$1.log clients-$1.log ~/.config/TheRigger/engine.log 2>/dev/null
            stop
            [ -f $1.png ] && echo "SHOT-$1:$(base64 -w0 $1.png)"
          }
          npx electron --version
          shot benvenuto it ""
          shot radio-it it --updated
          shot radio-en en --updated

  release:
    needs: [check, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: app-*
          merge-multiple: true
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          ls -la dist
          gh release create "v${VERSION}" dist/* \
            --repo "${{ github.repository }}" \
            --title "The Rigger ${VERSION}" \
            --notes "Le installazioni esistenti si aggiornano da sole. (build ${SHA:0:12})" --latest
          # resta solo l'ultima release: via le precedenti e i loro tag
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | while read -r t; do
            if [ "$t" != "v${VERSION}" ]; then
              gh release delete "$t" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            fi
          done
